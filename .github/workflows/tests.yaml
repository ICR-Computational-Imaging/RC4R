name: Unit tests

on:
  push:
    branches: ["**"]  # All branches wil run unit tests.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      QT_QPA_PLATFORM: offscreen  # Exercise the desktop UI without a display.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v6.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python
        run: uv python install

      # QtGui needs the EGL shared library even when Qt renders offscreen.
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      # Tests import training modules, but use synthetic data and mocked downloads.
      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group pytest --group train

      - name: Run pytest with coverage
        run: uv run --locked --no-default-groups --group pytest --group train pytest
