name: Unit tests

on:
  push:
    branches: ["**"]  # All branches wil run unit tests.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      QT_QPA_PLATFORM: offscreen  # Exercise the optional desktop UI without a display.

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and select Python
        uses: astral-sh/setup-uv@v6.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python
        run: uv python install

      # Tests import training modules, but use synthetic data and mocked downloads.
      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group pytest --group train --extra ui

      - name: Run pytest with coverage
        run: uv run --locked --no-default-groups --group pytest --group train --extra ui pytest

      - name: Check UI coverage
        run: >-
          uv run --locked --no-default-groups --group pytest --group train --extra ui
          pytest tests/ui --cov-reset --cov=dermapred.ui --cov-fail-under=80
