# --8<-- [start:doc_action]
name: Documentation  # Name of workflow, as it appears in the GitHub Actions UI.

on:  # Define the events that trigger this workflow.
  push:  # Workflow runs when changes are pushed to GitHub.
    branches:
      - main  # Workflow runs only when changes are pushed to the main branch.
    paths:  # Workflow runs only when changes are pushed to files that affect documentation.
      - "docs/**"  # Documentation pages and assets.
      - "mkdocs.yaml"  # MkDocs configuration and navigation.
      - "pyproject.toml"  # Project dependencies, including documentation tools.
      - "uv.lock"  # Exact dependency versions used to build the documentation.
      - ".github/workflows/docs.yaml"  # This workflow definition.
  workflow_dispatch:  # Write access users can trigger workflow manually within GitHub.

permissions:  # Grant the workflow only the GitHub permissions it requires.
  contents: read  # Allow the workflow to read repository files.
  pages: write  # Allow the deploy job to publish to GitHub Pages.
  id-token: write  # Allow secure authentication for the Pages deployment.

concurrency:  # Control what happens when multiple documentation runs overlap.
  group: pages  # Place all GitHub Pages deployments in the same concurrency group.
  cancel-in-progress: false  # Allow an active deployment to finish before the next begins.

jobs:  # Define the tasks performed by this workflow.  Must be defind as "jobs".
  build:  # Internal identifier for the documentation build job.  Unlike "jobs", name is chosen by you.
    name: Build documentation  # Job name displayed in the GitHub Actions UI.
    runs-on: ubuntu-latest  # Run the job on a temporary GitHub-hosted Ubuntu computer.

    steps:  # Run these build operations in order on the same runner.  Must be defined as "steps".
      - name: Check out repository  # Name of  step displayed in the GitHub Actions UI. Make obvious.
        uses: actions/checkout@v7  # Use GitHub's maintained repository checkout action.

      - name: Install uv 
        uses: astral-sh/setup-uv@v10  # Use Astral's maintained uv setup action.
        with:  # Provide configuration values to the setup action.
          enable-cache: true  # Cache downloaded dependencies to make later runs faster.

      - name: Install Python
        run: uv python install 3.11  # Run this shell command on the Ubuntu runner.

      - name: Install documentation dependencies
        run: uv sync --locked --no-default-groups --group docs  # Define the shell script to be run.

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5  # Use GitHub's maintained Pages configuration action.

      - name: Build documentation
        run: uv run --locked mkdocs build --strict --site-dir site  # Fail on warnings; write to site/.

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4  # Use GitHub's Pages-specific upload action.
        with:  # Provide configuration values to the upload action.
          path: site  # Upload the directory created by the MkDocs build.

  deploy:  # Internal identifier for the GitHub Pages deployment job. Again, precise name is chosen by you.
    name: Deploy documentation
    runs-on: ubuntu-latest 
    needs: build  # Start only after the build job completes successfully.
    environment:  # Associate the deployment with GitHub's Pages environment.
      name: github-pages  # Environment used for protection rules and deployment history.
      url: ${{ steps.deployment.outputs.page_url }}  # Display the deployed site URL in GitHub.

    steps:  # Run these deployment operations in order.
      - name: Deploy GitHub Pages site  # Publish the uploaded artifact to GitHub Pages.
        id: deployment  # Identifier used to read this step's page_url output above.
        uses: actions/deploy-pages@v5  # Use GitHub's maintained Pages deployment action.
# --8<-- [end:doc_action]
