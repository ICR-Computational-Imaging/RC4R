      hash: md5
      md5: 5ba47f579f9f9dbfea3d7ffe3b9006a6
      size: 2507
    params:
      params.yaml:
        calibration:
          method: isotonic
          cross_validation_folds: 5
          reliability_bins: 10
          inference_batch_size: 256
          random_seed: 42
    outs:
