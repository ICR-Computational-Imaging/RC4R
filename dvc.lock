      size: 1131
    - path: results/trained_models/binary_classifier.pt
      hash: md5
      md5: 611a3be32a5b57fb41dfaad71ca741b7
      size: 181043
    - path: src/dermapred/dvcstages/calibration.py
      hash: md5
      md5: ce176b4275d11ae45f22c60addaa05a1
      size: 12714
    - path: src/dermapred/inference/calibration.py
      hash: md5
      md5: 5aa29924694ca16f705d4389979a9d2b
      size: 7103
    - path: src/dermapred/models/binary_classifier.py
      hash: md5
      md5: b83a182ad1c83fa730fb4fb6166cc41c
