# This file provides version-controlled settings for data acquisition and for
# DVC processing and training stages.

data:
  dermamnist:
    image_size: 64  # Supported values: 28, 64, 128, or 224.

train:
  batch_size: 64
  epochs: 40
  learning_rate: 0.001
  random_seed: 42
  num_workers: 0  # Keep at zero for a simple, deterministic teaching example.
  augmentation:
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotation_probability: 0.5

calibration:
  method: isotonic  # Supported values: isotonic or platt.
  cross_validation_folds: 5
  reliability_bins: 10
  inference_batch_size: 256
  random_seed: 42

evaluation:
  threshold: 0.5
  bootstrap_iterations: 2000
  confidence_level: 0.95
  reliability_bins: 10
  inference_batch_size: 256
  random_seed: 42
