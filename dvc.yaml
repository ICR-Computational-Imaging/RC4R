# Source data are acquired separately and tracked with `dvc add`, so
# downloading them is deliberately not a pipeline stage.
stages:
  preprocess:
    cmd: >-  # This allows the command to be written on multiple lines for readability.
      uv run --group train
      python -m dermapred.dvcstages.preprocessing
      --input-dir data/raw_data
      --output-dir data/processed_data
      --splits train validation
    deps:
    - src/dermapred/data/preprocessing.py
    - src/dermapred/dvcstages/preprocessing.py
    - data/raw_data/train_images.npy
    - data/raw_data/validation_images.npy
    outs:
    - data/processed_data/train_images.npy
    - data/processed_data/validation_images.npy

  train:
    cmd: >-
      uv run --group train
      python -m dermapred.dvcstages.training
      --train-images data/processed_data/train_images.npy
      --train-labels data/raw_data/train_labels.npy
      --validation-images data/processed_data/validation_images.npy
      --validation-labels data/raw_data/validation_labels.npy
      --params-path params.yaml
      --model-output results/trained_models/binary_classifier.pt
      --history-output results/training/history.csv
      --plot-output results/training/loss_curve.png
    deps:
    - src/dermapred/models/binary_classifier.py
    - src/dermapred/plotting/training.py
    - src/dermapred/dvcstages/training.py
    - data/processed_data/train_images.npy
    - data/raw_data/train_labels.npy
    - data/processed_data/validation_images.npy
    - data/raw_data/validation_labels.npy
    params:
    - params.yaml:
      - training
    outs:
    - results/trained_models/binary_classifier.pt
    - results/training/history.csv

  calibrate:
    cmd: >-
      uv run --group train
      python -m dermapred.dvcstages.calibration
      --model-path results/trained_models/binary_classifier.pt
      --validation-images data/processed_data/validation_images.npy
      --validation-labels data/raw_data/validation_labels.npy
      --params-path params.yaml
      --calibrator-output results/calibration/probability_calibrator.json
      --metrics-output results/calibration/validation_metrics.json
      --plot-output results/calibration/validation_calibration.png
    deps:
    - src/dermapred/inference/calibration.py
    - src/dermapred/models/binary_classifier.py
    - src/dermapred/plotting/calibration.py
    - src/dermapred/dvcstages/calibration.py
    - results/trained_models/binary_classifier.pt
    - data/processed_data/validation_images.npy
    - data/raw_data/validation_labels.npy
    params:
    - params.yaml:
      - calibration
    outs:
    - results/calibration/probability_calibrator.json
