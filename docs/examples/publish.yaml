name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Package registry
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  build:
    # Publication is allowed only from a version tag, never from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6.0.1
        with:
          python-version: "3.12"
      - name: Install Python
        run: uv python install
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(tr -d '\r\n' < VERSION)"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "::error::Release tag does not match VERSION."
            exit 1
          fi
      - name: Run synthetic tests
        run: |
          uv sync --locked --no-default-groups --group pytest --group train
          uv run --locked --no-default-groups --group pytest --group train pytest
      - name: Build distributions
        run: uv build
      - name: Check installed wheel outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -c "from dermapred.inference import Predictor; print('Installed wheel imports successfully')"
      - name: Save packages for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.registry }}
    permissions:
      contents: read
    steps:
      - name: Retrieve the built packages
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v6.0.1
      - name: Publish verified distributions
        env:
          REGISTRY: ${{ inputs.registry }}
          # Each GitHub environment stores its own registry token under this name.
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "::error::Add the PYPI_API_TOKEN secret to the selected GitHub environment."
            exit 1
          fi
          case "$REGISTRY" in
            testpypi)
              uv publish --trusted-publishing never \
                --publish-url https://test.pypi.org/legacy/ dist/*
              ;;
            pypi)
              uv publish --trusted-publishing never dist/*
              ;;
            *) exit 1 ;;
          esac
