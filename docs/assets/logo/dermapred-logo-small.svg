<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="240"
   height="240"
   viewBox="0 0 240 240"
   role="img"
   aria-labelledby="logo-title logo-description"
   version="1.1"
   id="svg12"
   sodipodi:docname="dermapred-logo-small.svg"
   inkscape:version="1.4 (e7c3feb1, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview12"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.74389035"
     inkscape:cx="881.17826"
     inkscape:cy="201.64262"
     inkscape:window-width="2800"
     inkscape:window-height="987"
     inkscape:window-x="0"
     inkscape:window-y="25"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg12" />
  <title
     id="logo-title">DermaPred logo</title>
  <desc
     id="logo-description">A stylised skin lesion inside scan brackets, followed by the word DermaPred.</desc>
  <defs
     id="defs4">
    <linearGradient
       id="mark-background"
       x1="30"
       y1="30"
       x2="270"
       y2="270"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#173b61"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#245a78"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="lesion-fill"
       x1="96.859856"
       y1="109.59961"
       x2="190.81323"
       y2="203.55299"
       gradientTransform="scale(1.0358103,0.96542772)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#b54d78"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#713a74"
         id="stop4" />
    </linearGradient>
  </defs>
  <!--
    Standalone pictorial mark. To export it separately, use a 0 0 300 300
    viewBox and retain this group together with the defs block above.
  -->
  <g
     id="dermapred-mark"
     aria-label="DermaPred pictorial mark"
     transform="translate(-30,-30)"
     inkscape:export-filename="dermapred-mark.png"
     inkscape:export-xdpi="96"
     inkscape:export-ydpi="96">
    <rect
       x="30"
       y="30"
       width="240"
       height="240"
       rx="58"
       fill="url(#mark-background)"
       id="rect4"
       style="fill:url(#mark-background)" />
    <!-- Simplified skin field -->
    <circle
       cx="150"
       cy="150"
       r="67"
       fill="#f3c7ae"
       id="circle4" />
    <circle
       cx="150"
       cy="150"
       r="67"
       fill="none"
       stroke="#ffffff"
       stroke-opacity="0.24"
       stroke-width="5"
       id="circle5" />
    <!-- Abstract lesion: intentionally organic rather than perfectly circular -->
    <path
       d="m 150,106 c 24,-2 45,14 47,36 4,22 -11,44 -33,52 -21,8 -47,-4 -58,-23 -12,-20 -4,-45 15,-57 9,-6 19,-9 29,-8 z"
       fill="url(#lesion-fill)"
       id="path5"
       style="fill:url(#lesion-fill)" />
    <circle
       cx="136"
       cy="134"
       r="9"
       fill="#d98491"
       opacity="0.72"
       id="circle6" />
    <!-- Scan brackets suggest detection and prediction -->
    <path
       d="M 91,125 V 98 q 0,-7 7,-7 h 27"
       fill="none"
       stroke="#ffffff"
       stroke-width="11"
       stroke-linecap="round"
       id="path6" />
    <path
       d="m 175,91 h 27 q 7,0 7,7 v 27"
       fill="none"
       stroke="#ffffff"
       stroke-width="11"
       stroke-linecap="round"
       id="path7" />
    <path
       d="m 209,175 v 27 q 0,7 -7,7 h -27"
       fill="none"
       stroke="#52d6c5"
       stroke-width="11"
       stroke-linecap="round"
       id="path8" />
    <path
       d="M 125,209 H 98 q -7,0 -7,-7 v -27"
       fill="none"
       stroke="#52d6c5"
       stroke-width="11"
       stroke-linecap="round"
       id="path9" />
    <!-- Small prediction indicator -->
    <path
       d="m 212,68 v 16 m -8,-8 h 16"
       stroke="#52d6c5"
       stroke-width="7"
       stroke-linecap="round"
       id="path10" />
  </g>
  <!-- Wordmark -->
  <metadata
     id="metadata12">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>DermaPred logo</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
