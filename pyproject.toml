# This is a pyproject.toml file for a Python project. 
# It specifies the build system, project metadata, dependencies, and tool configurations.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dermapred"
dynamic = ["version"]
description = "A template for reproducible code in research. An example is provided for classifying skin lesions using the DermaMNIST dataset."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["torch", "pillow", "numpy"]

[project.scripts]
dermapred = "dermapred.inference.cli:main"

[dependency-groups]
train = [
    "dvc>=2.0",
    "matplotlib>=3.10",
    "medmnist>=3.0,<4",
    "monai>=1.5,<2",
    "pyyaml>=6",
    "scikit-learn>=1.6,<2",
    "tqdm",
]
pytest = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.11"]
type = ["mypy>=1.15", "types-pyyaml"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9", "mkdocstrings[python]>=0.29"]
notebooks = ["jupyterlab", "ipykernel", "matplotlib", "scikit-learn"]
dev = [
    { include-group = "pytest" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "docs" },
    { include-group = "notebooks" },
]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=dermapred",
    "--cov=scripts",
    "--cov-report=term-missing",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dermapred", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
