[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rc4r"
dynamic = ["version"]
description = "A template for reproducible code in research"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # Add only dependencies required to use the installed package.
]

[dependency-groups]
train = [
    # Add dependencies used to reproduce data processing and model training.
]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.11"]
type = ["mypy>=1.15"]
docs = ["mkdocs>=1.6", "mkdocstrings[python]>=0.29"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "docs" },
]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=rc4r",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rc4r"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
